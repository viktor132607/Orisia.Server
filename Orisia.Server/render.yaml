previews:
  generation: off

services:
  - type: web
    runtime: docker
    name: Orisia.Server
    repo: https://github.com/viktor132607/Orisia.Server.git
    branch: main
    plan: free
    region: frankfurt
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /openapi/v1.json
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "10000"
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: orisiadb
          property: connectionString
      - key: Jwt__Issuer
        value: Orisia.Server.API
      - key: Jwt__Audience
        value: Orisia.Server.API.Client
      - key: Jwt__Secret
        sync: false
      - key: Jwt__AccessTokenExpiryMinutes
        value: "120"
      - key: Jwt__RefreshTokenExpiryDays
        value: "30"
      - key: ClientApp__BaseUrl
        value: https://orisia-client-zgwt.onrender.com
      - key: Cors__AllowedOrigins__0
        value: https://orisia-client-zgwt.onrender.com
      - key: Cors__AllowedOrigins__1
        value: http://localhost:3000
      - key: Cors__AllowedOrigins__2
        value: https://localhost:3000
      - key: Cors__AllowedOrigins__3
        value: http://127.0.0.1:3000
      - key: Email__DeliveryMode
        value: Console
      - key: Email__SenderEmail
        value: noreply@orisia.local
      - key: Email__SenderName
        value: Orisia
      - key: Email__PasswordResetTokenExpiryMinutes
        value: "30"
      - key: DevelopmentSettings__ResetDatabaseOnStart
        value: "false"
      - key: DevelopmentSettings__ExposeEmailPreviewLinks
        value: "false"

databases:
  - name: orisia-db
    databaseName: orisiadb
    user: orisiadb_user
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
    ipAllowList: []
