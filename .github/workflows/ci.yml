name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orisia_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ORISIA_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=orisia_ci;Password=ci-only-password;SSL Mode=Disable

    defaults:
      run:
        working-directory: Orisia.Server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Orisia.Server.sln

      - name: PostgreSQL backup utilities
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Build
        run: dotnet build Orisia.Server.sln --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test Orisia.Server.Tests.Unit/Orisia.Server.Tests.Unit.csproj --configuration Release --no-build --verbosity normal

      - name: Build Render Docker image
        working-directory: .
        run: docker build -t orisia-server:ci .
