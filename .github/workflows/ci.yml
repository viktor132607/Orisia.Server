name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify server
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: Orisia.Server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Orisia.Server.sln

      - name: Build
        run: dotnet build Orisia.Server.sln --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test Orisia.Server.Tests.Unit/Orisia.Server.Tests.Unit.csproj --configuration Release --no-build --verbosity normal
